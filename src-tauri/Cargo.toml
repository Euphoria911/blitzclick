[package]
name = "blitzclick"
version = "0.1.0"
description = "A fast desktop autoclicker with a retro UI."
authors = ["Euphoria911"]
edition = "2024"

[lib]
name = "blitzclick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.3"
global-hotkey = "0.6"
anyhow = "1"
parking_lot = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
